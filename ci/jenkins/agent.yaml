apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-deployer
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  nodeSelector:
    jenkins-agent: "true"
  containers:
    - name: kubectl
      image: salmahesham1114/jenkins-kubectl:1
      command: ["sleep"]
      args: ["99d"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
